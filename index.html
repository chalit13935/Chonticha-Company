<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <!-- ล็อก Viewport ให้พอดีจอมือถือ ป้องกันเบราว์เซอร์ซูมขยายเอง -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Chonticha Company</title>
  
  <!-- Tailwind CSS & Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* รองรับการซ่อนแถบ Address bar บน Safari/Chrome มือถือ */
      overflow: hidden;
      font-family: 'Sarabun', sans-serif;
      background-color: #0f172a;
    }

    /* Animation สำหรับหน้าโหลด */
    @keyframes pulse-slow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.85; }
    }
    .animate-pulse-slow {
      animation: pulse-slow 2s infinite ease-in-out;
    }

    /* เอฟเฟกต์เฟดออกเมื่อโหลดเสร็จ */
    .fade-out {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease-out;
    }

    /* ตัวครอบ iframe ป้องกันขอบล้นและรองรับ Touch scroll บน iOS */
    .iframe-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-overflow-scrolling: touch;
    }

    .app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body class="relative">

  <!-- 🌟 หน้า SPLASH SCREEN (แสดงขณะกำลังโหลด) -->
  <div id="loading-screen" class="fixed inset-0 z-50 flex flex-col items-center justify-between p-8 bg-gradient-to-br from-slate-900 via-purple-950 to-slate-900 text-white">
    
    <!-- พื้นหลังแสงฟุ้ง (Glow Effect) -->
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 bg-rose-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <div></div>

    <!-- ส่วนกลาง: โลโก้ & ชื่อแอป -->
    <div class="flex flex-col items-center text-center z-10 animate-pulse-slow">
      <div class="w-20 h-20 mb-4 rounded-3xl bg-gradient-to-tr from-rose-500 to-purple-600 p-0.5 shadow-2xl shadow-rose-500/30 flex items-center justify-center">
        <div class="w-full h-full bg-slate-900/80 backdrop-blur-md rounded-[22px] flex items-center justify-center">
          <span class="text-4xl">🏢</span>
        </div>
      </div>
      
      <h1 class="text-2xl font-bold tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400">
        CHONTICHA
      </h1>
      <p class="text-xs text-rose-400 font-medium tracking-widest mt-1 uppercase">
        Company Management
      </p>
    </div>

    <!-- ส่วนล่าง: สปินเนอร์ & ข้อความ -->
    <div class="w-full max-w-xs flex flex-col items-center gap-3 z-10">
      <div class="flex items-center gap-2 text-slate-400 text-xs font-light">
        <svg class="animate-spin h-4 w-4 text-rose-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span>กำลังเชื่อมต่อระบบ...</span>
      </div>

      <div class="w-32 h-1 bg-slate-800 rounded-full overflow-hidden">
        <div class="h-full bg-gradient-to-r from-rose-500 to-purple-500 rounded-full animate-pulse"></div>
      </div>
    </div>

  </div>

  <!-- 📱 IFRAME CONTAINER (ครอบหน้าเว็บ Apps Script) -->
  <div class="iframe-container">
    <iframe 
      id="web-app-frame"
      class="app-frame"
      src="https://script.google.com/macros/s/AKfycbwli_ZM7_8e_2YTxqWxAeAVvR4HcAPn7WXOhskRnQ5RMExAfkeWUJnYGcKuDWFFm7Op-Q/exec"
      allow="geolocation; microphone; camera; clipboard-write"
      onload="hideLoadingScreen()">
    </iframe>
  </div>

  <script>
    function hideLoadingScreen() {
      const loader = document.getElementById('loading-screen');
      if (loader && loader.style.display !== 'none') {
        loader.classList.add('fade-out');
        setTimeout(() => {
          loader.style.display = 'none';
        }, 500);
      }
    }

    // ซ่อนหน้า SplashScreen อัตโนมัติใน 5 วินาทีหากโหลดช้า
    setTimeout(hideLoadingScreen, 5000);
  </script>

</body>
</html>
